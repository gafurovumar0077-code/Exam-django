{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add book</title>
        <link rel="stylesheet" href="{% static 'style.css' %}">
    </head>
    <body>
        <div class="df">
            <h1 class="as">Add book</h1>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="fd">
                    <label for="book_name">Book name</label>
                    <input type="text" name="book_name" id="book_name" placeholder="Name Book" required>
                </div>

                <div class="fd">
                    <label for="caption">Description</label>
                    <input type="text" name="caption" id="caption" placeholder="Caption" required>
                </div>

                <div class="fd">
                    <label for="autor">Author</label>
                    <select name="autor" id="autor" required>
                        {% for aut in author %}
                            <option value="{{aut.id}}">{{aut.firstname}} {{aut.lastname}}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="fd">
                    <label for="picture">Book cover</label>
                    <input type="file" name="picture" id="picture" required>
                </div>

                <div class="az">
                    <button class="bt" type="submit">Save</button>
                    <a class="bt" href="http://127.0.0.1:8000/">Home</a>
                </div>
            </form>
        </div>
    </body>
</html>
