{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="{% static 'style.css' %}">
        <title>Update author</title>
    </head>
    <body>
        <div class="df">
            <h1 class="as">Update author</h1>
            <form method="POST">
                {% csrf_token %}
                <input type="text" name="firstname" placeholder="firstname" value="{{author.firstname}}" required>
                <input type="text" name="lastname" placeholder="lastname" value="{{author.lastname}}" required>
                <input type="number" name="age" placeholder="age" value="{{author.age}}" required>
                <button class="bt" type="submit">Save</button>
                <a class="bt" href="http://127.0.0.1:8000/">Home</a>
            </form>
        </div>
    </body>
</html>
